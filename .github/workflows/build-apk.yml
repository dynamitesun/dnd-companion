name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build the web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../SoloDM.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoloDM-apk
          path: SoloDM.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Solo DM build ${{ github.run_number }}
          body: Download SoloDM.apk below on your Android phone and open it to install.
          files: SoloDM.apk
          make_latest: true
